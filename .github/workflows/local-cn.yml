name: Local Chinese channels
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --experimental-strip-types --test apps/local-bridge/test/*.test.mjs
      - run: git diff --check
